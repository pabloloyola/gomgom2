[project]
name = "eipg-reviewer"
version = "0.1.0"
description = "Reviewer artifact for Economically-Informed Persona Generators."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=14.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
gepa = [
  "gepa==0.1.4",
]
local-llm = [
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=4.57",
  "accelerate>=1.0",
  "huggingface_hub>=0.30",
  "sentencepiece>=0.2",
  "Pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eipg"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
